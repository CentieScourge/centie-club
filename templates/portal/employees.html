{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h2>👥 Сотрудники мэрии</h2>
        <div class="row">
            {% for e in employees %}
                <div class="col-md-4 col-lg-3 mb-4 text-center">
                    <div class="card h-100">
                        <div class="card-body">
                            {% if e.photo %}<img src="{{ e.photo.url }}" class="rounded-circle mb-2" style="width:120px;height:120px;object-fit:cover">{% elif e.photo_url %}<img src="{{ e.photo_url }}" class="rounded-circle mb-2" style="width:120px;height:120px;object-fit:cover">{% else %}<div style="font-size:4rem">👤</div>{% endif %}
                            <h5>{{ e.name }}</h5>
                            <p class="text-muted">{{ e.position }}</p>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>Сотрудники пока не добавлены.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
