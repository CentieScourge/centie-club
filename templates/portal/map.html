{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h2>🗺️ Карта штата Сан-Андреас</h2>
        <p class="text-muted">Перетаскивайте и масштабируйте. URL карты можно менять в настройках (пока статичный).</p>
        <div id="mapContainer" style="height:500px;overflow:hidden;background:#1a1f2e;border-radius:12px;position:relative;">
            <img id="mapImg" src="https://cdn.discordapp.com/attachments/1497218767397322782/1497734351990030547/95086422aa2ccb1e.jpg" 
                 style="position:absolute;cursor:grab;max-width:none;" alt="Карта">
        </div>
        <div class="mt-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="zoom(1.2)">+</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="zoom(0.8)">−</button>
        </div>
    </div>
</div>
<script>
let scale = 0.25, tx = 0, ty = 0, dragging = false, sx, sy, stx, sty;
const img = document.getElementById('mapImg');
const cont = document.getElementById('mapContainer');
function update() {
    img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    img.style.transformOrigin = '0 0';
}
function zoom(f) { scale = Math.max(0.1, Math.min(3, scale * f)); update(); }
cont.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }, {passive:false});
cont.addEventListener('mousedown', e => { dragging=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; img.style.cursor='grabbing'; });
window.addEventListener('mousemove', e => { if(!dragging) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); update(); });
window.addEventListener('mouseup', () => { dragging=false; img.style.cursor='grab'; });
update();
</script>
{% endblock %}
